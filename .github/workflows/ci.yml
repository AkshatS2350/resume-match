name: CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --project backend ruff check src tests
      - run: uv run --project backend mypy --strict src
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --project backend pytest -q
  config-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test -f config/README.md
  properties:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --project backend pytest backend/tests/properties
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - run: npm ci --prefix web
      - run: npm run lint --prefix web
      - run: npm run typecheck --prefix web
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --project backend lint-imports --config .importlinter
      - run: uv run --project backend python tools/check_egress.py backend/src
      - run: uv run --project backend pytest -m boundary
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --project backend pytest backend/tests/privacy
  pii-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test -n "$(find fixtures/pii -type f 2>/dev/null)"
  reqx-accuracy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test -n "$(find fixtures/postings_labeled -type f 2>/dev/null)"
  fabrication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --project backend pytest backend/tests/fabrication
  determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --project backend python tools/check_determinism.py backend/src
      - run: uv run --project backend python tools/check_no_domain_branch.py backend/src
      - run: uv run --project backend pytest backend/tests/properties -m determinism
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
      - run: uv tool run pip-audit --strict backend
      - run: npm audit --prefix web --audit-level=high
      - uses: gitleaks/gitleaks-action@v2
  schema-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --project backend python tools/export_schemas.py
      - run: git diff --exit-code docs/schemas web/src/lib/api/generated
